<div class="player-detail2">
    <div class="title">
        <h3 class="mb-5 pt-5 text-center">Player 2 </h3>
    </div>
    <div class="player-name">
        <div class="container mb-5 mt-5">
            <form #playerForm="ngForm">
                <div class="mb-3">
                    <input type="text" [(ngModel)]="playerDetails2.playerName2" name="playerName2" class="form-control" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <button class="btn mt-4" (click)="addPlayerDetail(playerDetails2)" [disabled]="!playerForm.form.valid">Let's Play</button>
                </div>
            </form>
        </div>
    </div>
</div>
